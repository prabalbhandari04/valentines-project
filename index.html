
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Will you come to my birthday party ? 💖</title>

    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <main class="container">

        <div class="card">

            <div class="sparkles" aria-hidden="true"></div>

            <h1 id="title">Will you come to my birthday party??? 💖</h1>

            <div class="gif-wrapper">
                <img
                    id="gif"
                    class="bear-gif"
                    src="https://media.giphy.com/media/DtBHcARLqNAvVnYsyD/giphy.gif"
                    alt="Cute reaction"
                >
            </div>

            <p id="message" aria-live="polite"></p>

            <div class="button-container">
                <button id="yesBtn" class="btn yes-btn" type="button">
                    Yes 💕
                </button>

                <button id="noBtn" class="btn no-btn" type="button">
                    No 😭
                </button>
            </div>

        </div>

    </main>

    <div id="hearts-container" aria-hidden="true"></div>

    <script src="scripts.js"></script>

</body>
</html>
